plugins { id 'com.android.application' }
android {
    namespace 'app.chains.personal'
    compileSdk 35
    defaultConfig {
        applicationId 'app.chains.personal'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        personal {
            storeFile file('../.signing/chains.jks')
            storePassword System.getenv('CHAINS_STORE_PASSWORD')
            keyAlias 'chains'
            keyPassword System.getenv('CHAINS_STORE_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.personal } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
